<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ポケスリ個体値記録アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>ポケスリ個体値記録アプリ</h1>

  <div id="form">
    <input type="date" id="dateInput">
    <input type="text" id="nameInput" placeholder="ポケモン">
    <input type="number" id="levelInput" placeholder="レベル">
    <input type="number" id="friendLevelInput" placeholder="フレンドレベル">

    <h3>食材構成</h3>
    <input type="text" id="foodInput" placeholder="例：AAA">


    <h3>サブスキル</h3>

    <select id="sub1" class="subskill-select">
      <option value="">選択してください</option>
    
      <optgroup label="金色" class="gold">
        <option>きのみS</option>
        <option>おてつだいボーナス</option>
        <option>睡眠EXPボーナス</option>
        <option>スキルレベルアップM</option>
        <option>げんき回復ボーナス</option>
        <option>ゆめのかけらボーナス</option>
        <option>リサーチEXPボーナス</option>
      </optgroup>
    
      <optgroup label="青色" class="blue">
        <option>おてつだいスピードM</option>
        <option>スキル確率アップM</option>
        <option>食材確率アップM</option>
        <option>スキルレベルアップS</option>
        <option>最大所持数アップL</option>
        <option>最大所持数アップM</option>
      </optgroup>
    
      <optgroup label="白色" class="white">
        <option>おてつだいスピードS</option>
        <option>スキル確率アップS</option>
        <option>食材確率アップS</option>
        <option>最大所持数アップS</option>
      </optgroup>
    </select>
    
    <select id="sub2" class="subskill-select"></select>
    <select id="sub3" class="subskill-select"></select>
    <select id="sub4" class="subskill-select"></select>
    <select id="sub5" class="subskill-select"></select>

    <h3>性格</h3>
    <input type="text" id="natureInput" placeholder="例：おだやか">
  
    <button id="addBtn">記録する</button>
  </div>

  <a href="records.html">▶ 記録一覧を見る</a>

  <script src="main.js"></script>
</body>
</html>
